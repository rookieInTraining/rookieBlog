{{ define "content" }}
<div class="page-wrap"><section class="max-w-3xl">
  <header class="mb-10">
    <h1 class="font-display text-4xl md:text-5xl font-bold text-ink-full sc-chalk sc-fuzz">
      {{- i18n .Data.Plural | default .Title | title -}}
    </h1>
    <p class="mt-2 text-ink-subdued">Browse all {{ .Data.Plural }}.</p>
  </header>

  <ul class="flex flex-wrap gap-3">
    {{ range .Data.Terms.Alphabetical }}
    <li>
      <a href="{{ .Page.RelPermalink }}" class="inline-flex items-center gap-2 chalk-pill border border-ink-faint px-4 py-1.5 font-note text-base text-ink-strong hover:border-ink-subdued hover:text-ink-full transition-colors">
        <span>{{ .Page.Title }}</span>
        <span class="text-ink-subdued">{{ .Count }}</span>
      </a>
    </li>
    {{ end }}
  </ul>
</section></div>
{{ end }}
