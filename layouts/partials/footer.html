<footer class="border-t border-zinc-200 mt-24">
  <div class="max-w-3xl mx-auto px-5 md:px-8 py-10 text-sm text-zinc-500">
    {{ with .Site.Params.footercontent }}
    <p class="mb-3 text-zinc-600">{{ . }}</p>
    {{ end }}
    <p>
      ©
      {{ if (and .Site.Params.since (lt .Site.Params.since now.Year)) }}{{ .Site.Params.since }}–{{ end }}{{ now.Year }}
      {{ with .Site.Params.author }}· {{ . }}{{ end }}
    </p>
  </div>
</footer>
