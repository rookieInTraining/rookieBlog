<footer class="border-t border-ink-ghost mt-24">
  <div class="max-w-3xl mx-auto px-5 md:px-8 py-10 text-base text-ink-subdued">
    {{ with .Site.Params.footercontent }}
    <p class="mb-3 font-note text-ink-subdued">{{ . }}</p>
    {{ end }}
    <p>
      ©
      {{ if (and .Site.Params.since (lt .Site.Params.since now.Year)) }}{{ .Site.Params.since }}–{{ end }}{{ now.Year }}
      {{ with .Site.Params.author }}· {{ . }}{{ end }}
    </p>
  </div>
</footer>
