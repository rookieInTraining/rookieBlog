{{- /* Plain pages (Contact, …): the page in the main column, the author column beside it. */ -}}
<div class="page-wrap">
  <div class="with-author">
    <article class="with-author__main">
      <header class="mb-10">
        <h1 class="font-display text-4xl md:text-5xl font-bold text-ink-full sc-chalk sc-fuzz">
          {{ .Title }}
        </h1>
      </header>

      {{ partial "featured-image.html" . }}

      <div class="prose">
        {{ .Content }}
      </div>
    </article>

    <aside class="with-author__side" aria-label="{{ site.Params.author }}">
      {{ partial "author/column.html" (dict "variant" "full") }}
    </aside>
  </div>
</div>
