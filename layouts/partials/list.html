<section class="max-w-3xl mx-auto px-5 md:px-8 py-12 md:py-16">
  <header class="mb-10 animate-fade-in-up">
    <h1 class="font-display text-4xl md:text-5xl font-bold text-ink-full sc-chalk sc-fuzz">
      {{- if eq .Kind "term" -}}
        <span class="text-ink-faint">{{ i18n .Data.Plural 1 | title }}:</span>
      {{- end }}
      {{ i18n (lower .Title) | default .Title | title }}
    </h1>
  </header>

  {{ if .Content }}
  <div class="prose mb-12">
    {{ .Content }}
  </div>
  {{ end }}

  <ul class="space-y-8">
    {{- range .Paginator.Pages -}}
      {{- .Render "li" -}}
    {{- end -}}
  </ul>

  {{ partial "pagination.html" . }}
</section>
