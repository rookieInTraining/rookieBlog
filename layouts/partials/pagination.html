{{ if gt .Paginator.TotalPages 1 }}
<nav class="mt-16 flex items-center justify-between border-t border-zinc-200 pt-8 text-sm" aria-label="Pagination">
  <div>
    {{ if .Paginator.HasPrev }}
    <a href="{{ .Paginator.Prev.URL }}" class="font-medium text-zinc-900 hover:text-zinc-500 transition-colors">← Previous</a>
    {{ end }}
  </div>
  <div class="text-zinc-400 tabular-nums">{{ .Paginator.PageNumber }} / {{ .Paginator.TotalPages }}</div>
  <div>
    {{ if .Paginator.HasNext }}
    <a href="{{ .Paginator.Next.URL }}" class="font-medium text-zinc-900 hover:text-zinc-500 transition-colors">Next →</a>
    {{ end }}
  </div>
</nav>
{{ end }}
