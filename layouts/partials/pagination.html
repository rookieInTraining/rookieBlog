{{ if gt .Paginator.TotalPages 1 }}
<nav class="mt-16 flex items-center justify-between border-t border-ink-ghost pt-8 text-base" aria-label="Pagination">
  <div>
    {{ if .Paginator.HasPrev }}
    <a href="{{ .Paginator.Prev.URL }}" class="text-ink-full hover:text-chalk-pink transition-colors">← Previous</a>
    {{ end }}
  </div>
  <div class="font-note text-ink-faint">{{ .Paginator.PageNumber }} / {{ .Paginator.TotalPages }}</div>
  <div>
    {{ if .Paginator.HasNext }}
    <a href="{{ .Paginator.Next.URL }}" class="text-ink-full hover:text-chalk-pink transition-colors">Next →</a>
    {{ end }}
  </div>
</nav>
{{ end }}
