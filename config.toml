[[params.social]]
    name                                        = "LinkedIn"
    icon                                        = "fa-brands fa-linkedin fa-2x"
    weight                                      = 4
    url                                         = "https://www.linkedin.com/in/ish-abbi/"
[[params.social]]
    name                                        = "Medium"
    icon                                        = "fa-brands fa-medium fa-2x"
    weight                                      = 5
    url                                         = "https://medium.com/@ishabbi"
[[params.social]]
    name                                        = "Stackoverflow"
    icon                                        = "fa-brands fa-stack-overflow fa-2x"
    weight                                      = 5
    url                                         = "https://stackoverflow.com/users/3762268/techrookie89"

[params.csp]
    childsrc                                    = ["'self'"]
    fontsrc                                     = ["'self'", "https://fonts.gstatic.com", "https://cdn.jsdelivr.net/", "https://rookieintraining.github.io/", "https://r2cdn.perplexity.ai"]
    formaction                                  = ["'self'"]
    framesrc                                    = ["'self'", "https://comments.app", "https://rookieintraining.github.io/", "https://topmate.io"]
    imgsrc                                      = ["'self'", "data:", "https://*.googletagmanager.com", "https://rookieintraining.github.io/", "https://*.clarity.ms"]
    objectsrc                                   = ["'none'"]
    stylesrc                                    = ["'self'", "'unsafe-inline'", "https://fonts.googleapis.com/", "https://cdn.jsdelivr.net/", "https://rookieintraining.github.io/", "https://topmate.io", "https://*.amazonaws.com"]
    scriptsrc                                   = ["'self'", "'unsafe-inline'", "https://*.google-analytics.com", "https://*.googletagmanager.com", "https://comments.app", "https://rookieintraining.github.io/", "https://topmate.io", "https://*.amazonaws.com", "https://cdn.jsdelivr.net", "https://*.clarity.ms"]
    prefetchsrc                                     = ["'self'"]
    connectsrc                                  = ["'self'", "https://*.google-analytics.com", "https://*.analytics.google.com", "https://*.googletagmanager.com", "https://rookieintraining.github.io/", "https://*.clarity.ms", "https://*.bing.com"]

