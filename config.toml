baseurl                                         = "https://ishabbi.tech/"
title                                           = "Ish's Blog"
languagecode                                    = "en"
defaultcontentlanguage                          = "en"

enableEmoji                                     = true
canonifyurls                                    = true

enableRobotsTXT                                 = true

# Real last-modified dates from git history (feeds sitemap <lastmod> and og:modified_time).
# CI note: actions/checkout needs fetch-depth: 0 for this to see full history.
enableGitInfo                                   = true

googleAnalytics                                 = "G-NLSP1WW1RZ"

[pagination]
pagerSize                                       = 20

[markup.highlight]
style                                           = "monokai"

[markup.goldmark.renderer]
unsafe                                          = true

[taxonomies]
  category                                      = "categories"
  series                                        = "series"
  tag                                           = "tags"
  author                                        = "authors"

[params]
    author                                      = "Ish Abbi"

    # Microsoft Clarity project ID (heatmaps + session recordings).
    # Create a free project at https://clarity.microsoft.com and paste the ID here.
    # Leave empty to disable. Only loads in production builds (never on `hugo server`).
    clarityID                                   = "wzrefr0fo2"

    description                                 = "Welcome to Ish's blog. Find interesting articles and snippets about testing, software engineering and many more."
    keywords                                    = "blog,developer,personal,testing,automation"
    info                                        = "Full Stack Tester, Blogger and Musician"
    avatarurl                                   = "images/820535.png"

    featuredImage                               = "/images/blog-image-of-universe.jpg"

    faviconSVG                                  = "/icons/favicon.ico"
    favicon_32                                  = "/icons/favicon-32x32.png"
    favicon_16                                  = "/icons/favicon-16x16.png"

    footercontent                               = "The scariest paths often lead to the most exciting places"

    dateformat                                  = "January 2, 2006"

    # Homepage <title> only (the header wordmark still uses site title).
    HeadTitle                                   = "Ish's Blog · Software Testing, QA & Automation"

    hideCredits                                 = true
    hideCopyright                               = false
    since                                       = 2019
    # KaTeX is gated per-post: set `math: true` in front matter (site-wide loading
    # shipped ~280KB of KaTeX CSS+JS on every page).
    math                                        = false
    katex                                       = true

    rtl                                         = false

    hideColorSchemeToggle                       = true

    # Specify light/dark colorscheme
    colorscheme                                 = "auto"

    # Series see also post count
    maxSeeAlsoItems                             = 5

    # Related posts (tag overlap + category / recent fallback)
    maxRelatedPosts                             = 5
    relatedPostsByTag                           = true
    relatedPostsMinTagOverlap                   = 1
    relatedPostsLowOverlapThreshold             = 2
    relatedPostsFallbackRecent                  = 8

    # Custom CSS
    custom_css                                  = []

    # Custom JS
    custom_js                                   = []

[[params.social]]
    name                                        = "Github"
    icon                                        = "fa-brands fa-github fa-2x"
    weight                                      = 1
    url                                         = "https://github.com/rookieInTraining/"
[[params.social]]
    name                                        = "Twitter"
    icon                                        = "fa-brands fa-x-twitter fa-2x"
    weight                                      = 3
